name: Validate editorial integrity system

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: pip install --requirement requirements-validation.txt
      - name: Validate Skill suite
        run: python scripts/validate_skill_suite.py
      - name: Validate contract fixtures
        run: python scripts/run_contract_tests.py
      - name: Validate repository links
        run: python scripts/check_repository_links.py
      - name: Validate project manifests
        run: |
          for manifest in projects/*/project-editorial-manifest.yaml; do
            python scripts/validate_manifest.py "$manifest"
          done
      - name: Build diagnostic package
        run: |
          rm -rf .package-diagnostic
          mkdir -p .package-diagnostic/package .package-diagnostic/extract
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from package_skill import package
          package(Path('skills/anti-slop-auditor'), Path('.package-diagnostic/package'), validate_first=False)
          PY
      - name: Verify diagnostic archive parity
        run: |
          python - <<'PY'
          import hashlib, sys, zipfile
          from pathlib import Path, PurePosixPath
          sys.path.insert(0, 'scripts')
          from validate_packages import source_files
          skill=Path('skills/anti-slop-auditor').resolve()
          expected=source_files(skill)
          with zipfile.ZipFile('.package-diagnostic/package/skill.zip') as archive:
              assert archive.testzip() is None
              members=[item for item in archive.infolist() if not item.is_dir()]
              names=[item.filename for item in members]
              assert len(names)==len(set(names))
              assert set(names)=={f'{skill.name}/{name}' for name in expected}
              for item in members:
                  path=PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0]==skill.name
                  relative=PurePosixPath(*path.parts[1:]).as_posix()
                  assert hashlib.sha256(archive.read(item)).hexdigest()==expected[relative]
          PY
      - name: Verify diagnostic extraction parity
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from validate_packages import source_files
          skill=Path('skills/anti-slop-auditor').resolve()
          with zipfile.ZipFile('.package-diagnostic/package/skill.zip') as archive:
              archive.extractall('.package-diagnostic/extract')
          assert source_files(Path('.package-diagnostic/extract')/skill.name)==source_files(skill)
          PY
      - name: Verify diagnostic extracted contract
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from validate_packages import validate_extracted_skill
          validate_extracted_skill(Path('.package-diagnostic/extract/anti-slop-auditor'))
          PY
      - name: Validate all extracted packages
        run: python scripts/validate_packages.py --prevalidated
      - name: Verify release acceptance report
        run: python scripts/audit_repository.py
