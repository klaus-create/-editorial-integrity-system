name: Validate editorial integrity system

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: pip install --requirement requirements-validation.txt

      - name: Run release acceptance audit
        run: python scripts/audit_repository.py
