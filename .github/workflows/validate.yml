name: Apply audited remediation bundle

on:
  push:
    branches:
      - full-capability-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('remediation.ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited repository tree
        run: |
          set -euo pipefail
          cat remediation-parts/part-* | base64 -d > /tmp/remediation.tar.xz
          tar -xJf /tmp/remediation.tar.xz
          rm -rf remediation-parts remediation.ready

      - name: Commit audited remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply full capability audit remediation"
          git push origin HEAD:full-capability-audit
