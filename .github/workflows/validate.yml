name: Validate editorial integrity system

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: pip install --requirement requirements-validation.txt

      - name: Validate Skill suite
        run: python scripts/validate_skill_suite.py

      - name: Validate contract fixtures
        run: python scripts/run_contract_tests.py

      - name: Validate repository links
        run: python scripts/check_repository_links.py

      - name: Validate project manifests
        run: |
          for manifest in projects/*/project-editorial-manifest.yaml; do
            python scripts/validate_manifest.py "$manifest"
          done

      - name: Package anti-slop-auditor
        run: python scripts/validate_packages.py --skill skills/anti-slop-auditor --prevalidated
      - name: Package argument-structure-reviewer
        run: python scripts/validate_packages.py --skill skills/argument-structure-reviewer --prevalidated
      - name: Package authorship-capture
        run: python scripts/validate_packages.py --skill skills/authorship-capture --prevalidated
      - name: Package editorial-brief-compiler
        run: python scripts/validate_packages.py --skill skills/editorial-brief-compiler --prevalidated
      - name: Package editorial-integrity-router
        run: python scripts/validate_packages.py --skill skills/editorial-integrity-router --prevalidated
      - name: Package factual-verifier
        run: python scripts/validate_packages.py --skill skills/factual-verifier --prevalidated
      - name: Package final-editorial-gate
        run: python scripts/validate_packages.py --skill skills/final-editorial-gate --prevalidated
      - name: Package source-grounded-drafter
        run: python scripts/validate_packages.py --skill skills/source-grounded-drafter --prevalidated
      - name: Package voice-preserving-editor
        run: python scripts/validate_packages.py --skill skills/voice-preserving-editor --prevalidated
      - name: Package voice-profile-builder
        run: python scripts/validate_packages.py --skill skills/voice-profile-builder --prevalidated

      - name: Verify release acceptance report
        run: python scripts/audit_repository.py
