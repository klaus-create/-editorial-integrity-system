name: Apply audited remediation bundle

on:
  push:
    branches:
      - full-capability-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-capability-audit
          fetch-depth: 0

      - name: Verify transfer inventory
        run: |
          set -euo pipefail
          test -f remediation.ready
          count="$(find remediation-parts -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')"
          echo "parts=$count"
          test "$count" = "17"

      - name: Decode and verify archive
        run: |
          set -euo pipefail
          cat remediation-parts/part-* | base64 -d > /tmp/remediation.tar.xz
          ls -l /tmp/remediation.tar.xz
          echo "75c6e5af99d4ffa4ac378fe1d7af7cf063762c79f6c225fc5c3cc366c5456b13  /tmp/remediation.tar.xz" | sha256sum -c -

      - name: Extract audited repository tree
        run: |
          set -euo pipefail
          tar -xJvf /tmp/remediation.tar.xz
          rm -rf remediation-parts remediation.ready

      - name: Retain temporary importer workflow
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/validate.yml
          git status --short

      - name: Commit audited remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply full capability audit remediation"
          git push origin HEAD:full-capability-audit
