name: Diagnose editorial integrity validation

on:
  push:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: Capture Skill validation output
        id: skill_validation
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/validate_skill_suite.py 2>&1 | tee skill-validation.log

      - name: Upload Skill validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-diagnostic
          path: skill-validation.log
          retention-days: 1
          if-no-files-found: error

      - name: Preserve validation failure
        if: steps.skill_validation.outcome == 'failure'
        run: exit 1
