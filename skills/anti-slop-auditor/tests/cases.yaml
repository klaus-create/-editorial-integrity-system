- case_id: anti-slop.edge.generic-cluster
  category: edge
  risk: moderate
  input:
    summary: Opening contains a cluster of abstract corporate language.
  expected_behaviour: Return a consequential P1 edit finding.
  example_output:
    schema_version: '1.0'
    artefact_type: anti_slop_audit
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      draft_output: '1.0'
      voice_profile: '1.0'
    unresolved_issues: []
    human_action_required: false
    context_baseline:
      form: report
      audience: Executive team
      purpose: Support a decision
      voice_profile_used: true
      protected_characteristics:
      - Directness
    findings:
    - finding_id: F1
      location: opening
      category: linguistic_genericity
      severity: P1
      confidence: 0.95
      observed_pattern: Three abstract verbs and inflated modifiers delay the concrete claim.
      consequence: Opening is interchangeable and obscures agency.
      false_positive_test: Not required by genre or protected voice.
      protected_traits_considered:
      - Directness
      treatment: edit
    origin_claim_made: false
    rewrite_authorised: false
  assertions:
    equals:
      findings.0.category: linguistic_genericity
      findings.0.treatment: edit
    contains: {}
    prohibited_values: {}
