    artefact_version: '1.0'
    status: complete
    input_versions:
      draft_output: '1.0'
      review_findings: '1.0'
    unresolved_issues: []
    human_action_required: false
    editing_mode: light
    revised_text: The evidence supports a limited next step.
    edit_log:
    - edit_id: EDIT-001
      location: whole piece
      edit_level: 0
      problem: The draft already satisfies the requested clarity and voice constraints.
      justification: Return it unchanged rather than rewriting for variation.
      semantic_change_authorised: false
      before_proposition: The evidence supports a limited next step.
      after_proposition: The evidence supports a limited next step.
    preserved_characteristics:
    - Direct governing claim
    drift_checks:
      certainty: preserved
      causality: preserved
      attribution: preserved
      emotional_stance: preserved
      first_person: preserved
      protected_language: preserved
    material_changes: []
  assertions:
    equals:
      material_changes: []
    contains: {}
    prohibited_values: {}
