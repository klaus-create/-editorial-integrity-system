- case_id: voice.false-positive.context-variation
  category: false_positive
  risk: moderate
  input:
    summary: One register delays the thesis for legal context.
  expected_behaviour: Treat the trait as context-dependent rather than inconsistent.
  example_output:
    schema_version: '1.0'
    artefact_type: voice_profile
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      sample_set: '1.0'
      permission_record: '1.0'
    unresolved_issues: []
    human_action_required: false
    profile_id: VOICE-001
    owner: Author
    permission_status: confirmed
    sample_inventory:
    - sample_id: S1
      form: report
      date: '2026-01-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S2
      form: social
      date: '2026-02-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S3
      form: report
      date: '2026-03-15'
      authorship_confidence: high
      editing_history: light
      inclusion_status: included
      limitation: null
    - sample_id: S4
      form: social
      date: '2026-04-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S5
      form: report
      date: '2026-05-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S6
      form: social
      date: '2026-06-15'
      authorship_confidence: high
      editing_history: light
      inclusion_status: included
      limitation: null
    sample_assessment:
      sufficiency: adequate
      sample_count: 6
      estimated_word_count: 4200
      registers:
      - report
      - social
      authorship_confidence: high
      limitations: []
    enduring_traits:
    - trait_id: TR-001
      behaviour: Usually states the governing proposition early, except where legal context requires a
        qualification frame.
      scope: context_dependent
      confidence: high
      evidence_refs:
      - S1
      - S3
      counterevidence:
      - A formal legal-adjacent sample delays the claim for context.
      writing_instruction: Lead with the governing proposition and qualify its boundary before implications.
      anti_pattern: Do not delay the point with generic scene-setting.
    register_profiles:
      legal-adjacent:
      - trait_id: REG-LEGAL-001
        behaviour: Delays the thesis until the governing qualification is stated.
        scope: register_specific
        confidence: high
        evidence_refs:
        - S5
        - S6
        counterevidence:
        - Reports S1 and S2 state the thesis early.
        writing_instruction: State the legal qualification before the thesis only when consequence requires
          it.
        anti_pattern: Do not infer general scene-setting from legally necessary qualification.
    protected_characteristics:
    - characteristic: Legal qualification before proposition
      reason: Controls certainty and consequence in legal-adjacent work
      preservation_strength: high
      editing_implication: Do not move the thesis ahead of the qualification without review.
    discouraged_characteristics:
    - Generic consultant uplift.
    imitation_boundaries:
    - Do not copy signature phrases from samples.
  assertions:
    equals:
      status: complete
      sample_assessment.sufficiency: adequate
      register_profiles.legal-adjacent.0.scope: register_specific
    contains: {}
    prohibited_values: {}
