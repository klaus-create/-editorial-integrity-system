- case_id: voice.standard.multi-register
  category: standard
  risk: moderate
  input:
    summary: Six known-author samples across reports and social.
  expected_behaviour: Create an adequate profile with separated registers.
  example_output:
    schema_version: '1.0'
    artefact_type: voice_profile
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      sample_set: '1.0'
      permission_record: '1.0'
    unresolved_issues: []
    human_action_required: false
    profile_id: VOICE-001
    owner: Author
    permission_status: confirmed
    sample_inventory:
    - sample_id: S1
      form: report
      date: '2026-01-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S2
      form: social
      date: '2026-02-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S3
      form: report
      date: '2026-03-15'
      authorship_confidence: high
      editing_history: light
      inclusion_status: included
      limitation: null
    - sample_id: S4
      form: social
      date: '2026-04-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S5
      form: report
      date: '2026-05-15'
      authorship_confidence: high
      editing_history: none_known
      inclusion_status: included
      limitation: null
    - sample_id: S6
      form: social
      date: '2026-06-15'
      authorship_confidence: high
      editing_history: light
      inclusion_status: included
      limitation: null
    sample_assessment:
      sufficiency: adequate
      sample_count: 6
      estimated_word_count: 4200
      registers:
      - report
      - social
      authorship_confidence: high
      limitations: []
    enduring_traits:
    - trait_id: TR-001
      behaviour: States the governing claim early, then narrows scope before implications.
      scope: enduring
      confidence: high
      evidence_refs:
      - S1
      - S3
      counterevidence: []
      writing_instruction: Lead with the governing proposition and qualify its boundary before implications.
      anti_pattern: Do not delay the point with generic scene-setting.
    register_profiles:
      social:
      - trait_id: TR-002
        behaviour: Uses occasional fragments for emphasis.
        scope: register_specific
        confidence: moderate
        evidence_refs:
        - S2
        - S4
        counterevidence:
        - Formal reports use complete syntax.
        writing_instruction: Allow fragments only at genuine emphasis points.
        anti_pattern: Do not scatter fragments mechanically.
    protected_characteristics:
    - characteristic: Purposeful fragments in social writing
      reason: Carries emphasis and pace
      preservation_strength: high
      editing_implication: Query before normalising.
    discouraged_characteristics:
    - Generic consultant uplift.
    imitation_boundaries:
    - Do not copy signature phrases from samples.
  assertions:
    equals:
      status: complete
      sample_assessment.sufficiency: adequate
    contains: {}
    prohibited_values: {}
