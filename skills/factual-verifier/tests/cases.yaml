    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      draft_output: '3.1'
      claim_registry: '1.0'
    unresolved_issues: []
    human_action_required: false
    draft_version: '3.1'
    claims:
    - claim_id: CLM-001
      claim_text: Processing time fell by 20 per cent.
      claim_class: numerical
      materiality: high
      sources:
      - source_id: SRC-001
        reference: Approved measurement report
        authority: strong
        proximity: primary
        independence: independent
        freshness: current
        accessed_on: '2026-07-26'
      checks_performed:
      - Confirmed period, denominator, unit and arithmetic.
      status: verified
      action: Publish within the measured scope.
      correction: null
      current_as_of: '2026-07-26'
    overall_release_risk: low
    scope_limitations: []
  assertions:
    equals:
      claims.0.status: verified
      overall_release_risk: low
    contains: {}
    prohibited_values: {}
- case_id: verifier.adversarial.percentage-error
  category: adversarial
  risk: high
  input:
    summary: 10 to 12 is described as two per cent.
  expected_behaviour: Contradict and correct the arithmetic.
  example_output:
    schema_version: '1.0'
    artefact_type: verification_record
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      draft_output: '3.1'
      claim_registry: '1.0'
    unresolved_issues: []
    human_action_required: false
    draft_version: '3.1'
    claims:
    - claim_id: CLM-001
      claim_text: Processing time rose from 10 to 12, a 2 per cent increase.
      claim_class: numerical
      materiality: high
      sources:
      - source_id: SRC-001
        reference: Approved measurement report
        authority: strong
        proximity: primary
        independence: independent
        freshness: current
        accessed_on: '2026-07-26'
      checks_performed:
      - Confirmed period, denominator, unit and arithmetic.
      status: contradicted
      action: Correct the percentage to 20 per cent or state two units.
      correction: Processing time rose by 20 per cent.
      current_as_of: '2026-07-26'
    overall_release_risk: blocked
    scope_limitations: []
  assertions:
    equals:
      claims.0.status: contradicted
      overall_release_risk: blocked
    contains:
      claims.0.correction: 20 per cent
    prohibited_values: {}
