manifest_version: "1.0"

project:
  name: ""
  project_id: ""
  project_type: mixed
  description: ""
  status: active
  owner: ""

editorial_system:
  required_version: "0.1"
  compatibility: ""
  canonical_repository: "https://github.com/klaus-create/-editorial-integrity-system"

authorship:
  model: mixed
  accountable_author: ""
  accountable_editor: ""
  contributors: []
