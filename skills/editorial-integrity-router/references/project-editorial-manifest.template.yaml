required_skills:
  - editorial-integrity-router
optional_skills: []
source_locations: []

governance:
  final_approval: author
  named_approver: ""
  change_log_required: false
  claim_traceability_required: false
  retention: project lifetime
  privacy: private project workspace
  unresolved_issue_policy: surface

project_exceptions: []
