    summary: User asks for an audit, not a rewrite.
  expected_behaviour: Select Auditor with editing authority false.
  example_output:
    schema_version: '1.0'
    artefact_type: route_declaration
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: complete
    input_versions:
      assignment: '1.0'
      manifest: '1.0'
    unresolved_issues: []
    human_action_required: false
    task_type: review
    form: report
    workflow_level: full
    risk_dimensions:
      consequence: high
      factual: high
      privacy: low
      voice: moderate
      continuity: low
    modules:
    - name: anti-slop-auditor
      reason: Diagnosis only.
      may_retrieve: false
      may_edit: false
      may_release: false
      expected_artefact: anti_slop_audit
      stop_conditions:
      - Stop if the full piece is unavailable.
      downstream_consumers:
      - voice-preserving-editor
      - calling_agent
    required_inputs:
    - authorised brief
    - approved sources
    stale_artefacts: []
    approval:
      required: false
      approver: null
  assertions:
    equals:
      task_type: review
      modules.0.may_edit: false
    contains: {}
    prohibited_values: {}
- case_id: router.edge.missing-approver
  category: edge
  risk: high
  input:
    summary: High-risk release has no approval owner.
  expected_behaviour: Require human input and do not execute release.
  example_output:
    schema_version: '1.0'
    artefact_type: route_declaration
    assignment_id: ASSIGN-001
    artefact_version: '1.0'
    status: human_input_required
    input_versions:
      assignment: '1.0'
      manifest: '1.0'
    unresolved_issues:
    - issue_id: ISS-001
      description: No accountable approver is assigned for the high-risk release.
      owner: project_owner
      blocking: true
      required_action: Assign an approver before execution.
    human_action_required: true
    task_type: create
    form: report
    workflow_level: full
    risk_dimensions:
      consequence: high
      factual: high
      privacy: low
      voice: moderate
      continuity: low
    modules: []
    required_inputs:
    - authorised brief
    - approved sources
    stale_artefacts: []
    approval:
      required: true
      approver: null
  assertions:
    equals:
      status: human_input_required
      approval.approver: null
      human_action_required: true
    contains: {}
    prohibited_values: {}
