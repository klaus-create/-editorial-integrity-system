        result: pass
        evidence: Required evidence was reviewed.
      surface_quality:
        result: pass
        evidence: Required evidence was reviewed.
      approval:
        result: pass
        evidence: Required evidence was reviewed.
    outcome: ready
    material_reasons:
    - Mandatory checks completed.
    blocking_issues: []
    conditions_for_release: []
    approval:
      required: true
      approver: Project owner
      status: approved
      waivers: []
    verification_status: complete
    disclosure_status: not_required
    return_paths: []
  assertions:
    equals:
      outcome: ready
      verification_status: complete
    contains: {}
    prohibited_values: {}
