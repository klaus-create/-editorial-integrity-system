$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/route_declaration.schema.yaml
title: Route Declaration
description: Proportionate editorial route, authority and hand-off record.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- task_type
- form
- workflow_level
- risk_dimensions
- modules
- required_inputs
- stale_artefacts
- approval
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: route_declaration
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  task_type:
    enum:
    - create
    - review
    - edit
    - verify
    - release
    - profile
    - combined
  form:
    type: string
    minLength: 1
  workflow_level:
    enum:
    - lightweight
    - standard
    - full
    - extended
  risk_dimensions:
    type: object
    additionalProperties: false
    required:
    - consequence
    - factual
    - privacy
    - voice
    - continuity
    properties:
      consequence:
        enum:
        - low
        - moderate
        - high
      factual:
        enum:
        - low
        - moderate
        - high
      privacy:
        enum:
        - low
        - moderate
        - high
      voice:
        enum:
        - low
        - moderate
        - high
      continuity:
        enum:
        - low
        - moderate
        - high
  modules:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - reason
      - may_retrieve
      - may_edit
      - may_release
      - expected_artefact
      - stop_conditions
      - downstream_consumers
      properties:
        name:
          enum:
          - authorship-capture
          - voice-profile-builder
          - editorial-brief-compiler
          - source-grounded-drafter
          - argument-structure-reviewer
          - anti-slop-auditor
          - voice-preserving-editor
          - factual-verifier
          - final-editorial-gate
        reason:
          type: string
          minLength: 1
        may_retrieve:
          type: boolean
        may_edit:
          type: boolean
        may_release:
          type: boolean
        expected_artefact:
          type: string
          minLength: 1
        stop_conditions:
          type: array
          items:
            type: string
            minLength: 1
        downstream_consumers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - authorship-capture
            - voice-profile-builder
            - editorial-brief-compiler
            - source-grounded-drafter
            - argument-structure-reviewer
            - anti-slop-auditor
            - voice-preserving-editor
            - factual-verifier
            - final-editorial-gate
            - router
            - human_approver
            - calling_agent
  required_inputs:
    type: array
    items:
      type: string
      minLength: 1
  stale_artefacts:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - artefact_type
      - version
      - reason
      properties:
        artefact_type:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
  approval:
    type: object
    additionalProperties: false
    required:
    - required
    - approver
    properties:
      required:
        type: boolean
      approver:
        type:
        - string
        - 'null'
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
