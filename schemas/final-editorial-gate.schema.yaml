$schema: https://json-schema.org/draft/2020-12/schema
$title: Final Editorial Gate
$type: object
required: [outcome, integrity, voice, quality, governance]
properties:
  outcome:
    enum: [pass, pass_with_disclosure, revise, human_decision_required, fail]
  integrity:
    type: object
    properties:
      thesis_preserved: {type: boolean}
      claims_authorised: {type: boolean}
      uncertainty_visible: {type: boolean}
      attribution_accurate: {type: boolean}
  voice:
    type: object
    properties:
      author_fit: {type: boolean}
      register_fit: {type: boolean}
      protected_characteristics_preserved: {type: boolean}
      unnecessary_normalisation_detected: {type: boolean}
  quality:
    type: object
    properties:
      coherent: {type: boolean}
      specific: {type: boolean}
      proportionate_structure: {type: boolean}
      earned_conclusion: {type: boolean}
      generic_residue_materially_reduced: {type: boolean}
  governance:
    type: object
    properties:
      required_sources_present: {type: boolean}
      unresolved_issues_visible: {type: boolean}
      human_approval_required: {type: boolean}
      disclosure_required: {type: boolean}
  blocking_issues:
    type: array
    items: {type: string}
  recommended_actions:
    type: array
    items: {type: string}
