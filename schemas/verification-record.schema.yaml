$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/verification_record.schema.yaml
title: Verification Record
description: Reproducible claim-by-claim verification and publication action record.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- draft_version
- claims
- overall_release_risk
- scope_limitations
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: verification_record
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  draft_version:
    type: string
    minLength: 1
  claims:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - claim_id
      - claim_text
      - claim_class
      - materiality
      - sources
      - checks_performed
      - status
      - action
      - correction
      - current_as_of
      properties:
        claim_id:
          type: string
          minLength: 1
        claim_text:
          type: string
          minLength: 1
        claim_class:
          enum:
          - simple_fact
          - numerical
          - comparative
          - causal
          - predictive
          - quotation
          - scientific
          - legal_adjacent
          - product_capability
          - current_status
          - interpretation
        materiality:
          enum:
          - low
          - moderate
          - high
          - critical
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - reference
            - authority
            - proximity
            - independence
            - freshness
            - accessed_on
            properties:
              source_id:
                type: string
                minLength: 1
              reference:
                type: string
                minLength: 1
              authority:
                enum:
                - strong
                - adequate
                - weak
                - not_applicable
              proximity:
                enum:
                - primary
                - near_primary
                - secondary
                - remote
              independence:
                enum:
                - independent
                - interested_party
                - unknown
                - not_applicable
              freshness:
                enum:
                - current
                - acceptable
                - stale
                - unknown
              accessed_on:
                type:
                - string
                - 'null'
                format: date
        checks_performed:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        status:
          enum:
          - verified
          - qualified
          - attributed
          - author_judgement
          - contested
          - unverifiable
          - unsupported
          - contradicted
          - removed
        action:
          type: string
          minLength: 1
        correction:
          type:
          - string
          - 'null'
        current_as_of:
          type:
          - string
          - 'null'
          format: date
      allOf:
      - if:
          properties:
            status:
              const: verified
          required:
          - status
        then:
          properties:
            sources:
              minItems: 1
          required:
          - sources
      - if:
          properties:
            claim_class:
              const: current_status
          required:
          - claim_class
        then:
          properties:
            current_as_of:
              type: string
              format: date
          required:
          - current_as_of
      - if:
          properties:
            status:
              const: contradicted
          required:
          - status
        then:
          properties:
            correction:
              type: string
              minLength: 1
          required:
          - correction
  overall_release_risk:
    enum:
    - low
    - moderate
    - high
    - blocked
  scope_limitations:
    type: array
    items:
      type: string
      minLength: 1
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
