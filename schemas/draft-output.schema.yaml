$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/draft_output.schema.yaml
title: Draft Output
description: Source-grounded draft and material claim trace.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- form
- draft
- source_trace
- gap_markers
- integrity_summary
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: draft_output
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  form:
    type: string
    minLength: 1
  draft:
    oneOf:
    - type: string
    - type: object
    - type: array
  source_trace:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - location
      - claim_ids
      - source_refs
      - evidence_move
      properties:
        location:
          type: string
          minLength: 1
        claim_ids:
          type: array
          items:
            type: string
            minLength: 1
        source_refs:
          type: array
          items:
            type: string
            minLength: 1
        evidence_move:
          enum:
          - direct_evidence
          - attributed_view
          - author_judgement
          - labelled_inference
          - not_applicable
  gap_markers:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - marker
      - location
      - owner
      properties:
        marker:
          enum:
          - SOURCE_REQUIRED
          - AUTHOR_DECISION
          - EXAMPLE_REQUIRED
          - CURRENT_VERIFICATION_REQUIRED
        location:
          type: string
          minLength: 1
        owner:
          enum:
          - author
          - project_owner
          - verifier
          - unknown
  integrity_summary:
    type: object
    additionalProperties: false
    required:
    - invented_material_detected
    - claim_trace_complete
    - conclusion_within_scope
    properties:
      invented_material_detected:
        const: false
      claim_trace_complete:
        type: boolean
      conclusion_within_scope:
        type: boolean
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      gap_markers:
        maxItems: 0
      unresolved_issues:
        maxItems: 0
    required:
    - gap_markers
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
