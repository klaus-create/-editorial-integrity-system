$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/argument_review.schema.yaml
title: Argument Review
description: Diagnostic map of reasoning and structure without silent rewriting.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- governing_thesis
- argument_map
- findings
- review_limitations
- rewrite_authorised
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: argument_review
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  governing_thesis:
    type: object
    additionalProperties: false
    required:
    - text
    - status
    properties:
      text:
        type:
        - string
        - 'null'
      status:
        enum:
        - identified
        - ambiguous
        - missing
        - human_decision_required
  argument_map:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - node_id
      - node_type
      - text
      - supports
      properties:
        node_id:
          type: string
          minLength: 1
        node_type:
          enum:
          - thesis
          - claim
          - premise
          - evidence
          - warrant
          - counterclaim
          - conclusion
          - decision
        text:
          type: string
          minLength: 1
        supports:
          type: array
          items:
            type: string
            minLength: 1
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - finding_id
      - location
      - defect_type
      - severity
      - confidence
      - evidence_from_piece
      - consequence
      - repair_direction
      properties:
        finding_id:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        defect_type:
          enum:
          - thesis_drift
          - unsupported_claim
          - invalid_warrant
          - causal_overreach
          - contradiction
          - missing_counterargument
          - sequence_failure
          - nonfunctional_repetition
          - conclusion_overreach
          - decision_usefulness
          - other
        severity:
          enum:
          - P0
          - P1
          - P2
          - P3
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence_from_piece:
          type: string
          minLength: 1
        consequence:
          type: string
          minLength: 1
        repair_direction:
          type: string
          minLength: 1
  review_limitations:
    type: array
    items:
      type: string
      minLength: 1
  rewrite_authorised:
    const: false
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
