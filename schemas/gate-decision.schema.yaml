$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/gate_decision.schema.yaml
title: Gate Decision
description: Traceable release decision for one exact final version.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- draft_version
- release_surface
- workflow_level
- artefacts_reviewed
- check_results
- outcome
- material_reasons
- blocking_issues
- conditions_for_release
- approval
- verification_status
- disclosure_status
- return_paths
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: gate_decision
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  draft_version:
    type: string
    minLength: 1
  release_surface:
    type: string
    minLength: 1
  workflow_level:
    enum:
    - lightweight
    - standard
    - full
    - extended
  artefacts_reviewed:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - artefact_type
      - version
      - required
      - status
      - stale
      - reason
      properties:
        artefact_type:
          type: string
          minLength: 1
        version:
          type:
          - string
          - 'null'
        required:
          type: boolean
        status:
          enum:
          - present
          - missing
          - not_required
        stale:
          type: boolean
        reason:
          type: string
  check_results:
    type: object
    additionalProperties: false
    required:
    - authority
    - factual_integrity
    - human_meaning
    - privacy_and_disclosure
    - argument_and_structure
    - voice_and_form
    - surface_quality
    - approval
    properties:
      authority:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      factual_integrity:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      human_meaning:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      privacy_and_disclosure:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      argument_and_structure:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      voice_and_form:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      surface_quality:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
      approval:
        type: object
        additionalProperties: false
        required:
        - result
        - evidence
        properties:
          result:
            enum:
            - pass
            - conditional
            - fail
            - not_applicable
          evidence:
            type: string
            minLength: 1
  outcome:
    enum:
    - ready
    - conditional
    - human_decision_required
    - blocked
  material_reasons:
    type: array
    items:
      type: string
      minLength: 1
  blocking_issues:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - issue_id
      - description
      - owner
      - required_action
      properties:
        issue_id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        owner:
          enum:
          - author
          - project_owner
          - router
          - specialist
          - verifier
          - approver
          - unknown
        required_action:
          type: string
          minLength: 1
  conditions_for_release:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - issue_id
      - description
      - owner
      - required_action
      properties:
        issue_id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        owner:
          enum:
          - author
          - project_owner
          - router
          - specialist
          - verifier
          - approver
          - unknown
        required_action:
          type: string
          minLength: 1
  approval:
    type: object
    additionalProperties: false
    required:
    - required
    - approver
    - status
    - waivers
    properties:
      required:
        type: boolean
      approver:
        type:
        - string
        - 'null'
      status:
        enum:
        - approved
        - pending
        - not_required
        - unknown
      waivers:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - condition
          - authorised_by
          - reason
          properties:
            condition:
              type: string
              minLength: 1
            authorised_by:
              type: string
              minLength: 1
            reason:
              type: string
              minLength: 1
  verification_status:
    enum:
    - complete
    - partial
    - stale
    - not_required
  disclosure_status:
    enum:
    - complete
    - pending
    - not_required
  return_paths:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - issue
      - target
      - required_action
      properties:
        issue:
          type: string
          minLength: 1
        target:
          enum:
          - authorship-capture
          - editorial-brief-compiler
          - argument-structure-reviewer
          - voice-preserving-editor
          - factual-verifier
          - human
        required_action:
          type: string
          minLength: 1
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- properties:
    status:
      const: complete
  required:
  - status
- if:
    properties:
      outcome:
        const: ready
    required:
    - outcome
  then:
    properties:
      blocking_issues:
        maxItems: 0
      conditions_for_release:
        maxItems: 0
    required:
    - blocking_issues
    - conditions_for_release
- if:
    properties:
      outcome:
        const: conditional
    required:
    - outcome
  then:
    properties:
      conditions_for_release:
        minItems: 1
    required:
    - conditions_for_release
- if:
    properties:
      outcome:
        const: human_decision_required
    required:
    - outcome
  then:
    properties:
      human_action_required:
        const: true
      conditions_for_release:
        minItems: 1
    required:
    - human_action_required
    - conditions_for_release
- if:
    properties:
      outcome:
        const: blocked
    required:
    - outcome
  then:
    properties:
      blocking_issues:
        minItems: 1
    required:
    - blocking_issues
