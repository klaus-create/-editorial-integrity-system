$schema: https://json-schema.org/draft/2020-12/schema
$title: Authorship Source Pack
type: object
required: [assignment_id, purpose, central_thesis, intended_reader_effect, claims]
properties:
  assignment_id: {type: string}
  author_id: {type: [string, 'null']}
  purpose: {type: string}
  central_thesis: {type: string}
  intended_reader_effect: {type: string}
  claims:
    type: array
    items:
      type: object
      required: [claim_id, claim, claim_type, source_status, confidence]
      properties:
        claim_id: {type: string}
        claim: {type: string}
        claim_type:
          enum: [factual, numerical, causal, comparative, predictive, interpretive, normative, experiential, attributed, rhetorical]
        source_status:
          enum: [verified_fact, supplied_source, attributed_view, author_judgement, personal_recollection, inference, contested, uncertain, unsupported]
        confidence: {type: number, minimum: 0, maximum: 1}
        source_reference: {type: [string, 'null']}
        may_be_strengthened: {type: boolean, default: false}
        must_be_qualified: {type: boolean, default: false}
  observations: {type: array, items: {type: object}}
  experiences: {type: array, items: {type: object}}
  examples: {type: array, items: {type: object}}
  disagreements: {type: array, items: {type: object}}
  uncertainties: {type: array, items: {type: object}}
  protected_language: {type: array, items: {type: object}}
  prohibited_inventions: {type: array, items: {type: string}}
  missing_inputs: {type: array, items: {type: object}}
additionalProperties: false
