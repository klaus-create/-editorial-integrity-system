$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/edit_output.schema.yaml
title: Edit Output
description: Voice-preserving edit with material-change and drift record.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- editing_mode
- revised_text
- edit_log
- preserved_characteristics
- drift_checks
- material_changes
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: edit_output
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  editing_mode:
    enum:
    - mechanical
    - light
    - substantive
    - transformative
  revised_text:
    oneOf:
    - type: string
    - type: object
    - type: array
  edit_log:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - edit_id
      - location
      - edit_level
      - problem
      - justification
      - semantic_change_authorised
      - before_proposition
      - after_proposition
      properties:
        edit_id:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        edit_level:
          type: integer
          minimum: 0
          maximum: 6
        problem:
          type: string
          minLength: 1
        justification:
          type: string
          minLength: 1
        semantic_change_authorised:
          type: boolean
        before_proposition:
          type:
          - string
          - 'null'
        after_proposition:
          type:
          - string
          - 'null'
  preserved_characteristics:
    type: array
    items:
      type: string
      minLength: 1
  drift_checks:
    type: object
    additionalProperties: false
    required:
    - certainty
    - causality
    - attribution
    - emotional_stance
    - first_person
    - protected_language
    properties:
      certainty:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
      causality:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
      attribution:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
      emotional_stance:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
      first_person:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
      protected_language:
        enum:
        - preserved
        - authorised_change
        - drift_detected
        - not_applicable
  material_changes:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - edit_id
      - description
      - downstream_actions
      properties:
        edit_id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        downstream_actions:
          type: array
          uniqueItems: true
          items:
            enum:
            - reverify
            - regate
            - re_review_structure
            - refresh_brief
            - none
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      drift_checks:
        properties:
          certainty:
            not:
              const: drift_detected
          causality:
            not:
              const: drift_detected
          attribution:
            not:
              const: drift_detected
          emotional_stance:
            not:
              const: drift_detected
          first_person:
            not:
              const: drift_detected
          protected_language:
            not:
              const: drift_detected
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
