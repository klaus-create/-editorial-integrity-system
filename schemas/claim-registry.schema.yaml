$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/claim_registry.schema.yaml
title: Claim Registry
description: Versioned registry of material claims and publication status.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- claims
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: claim_registry
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  claims:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - claim_id
      - claim_text
      - claim_class
      - source_status
      - confidence
      - supporting_sources
      - verification_required
      - publication_status
      - final_locations
      properties:
        claim_id:
          type: string
          minLength: 1
        claim_text:
          type: string
          minLength: 1
        claim_class:
          enum:
          - factual
          - numerical
          - causal
          - comparative
          - predictive
          - quotation
          - scientific
          - legal_adjacent
          - product_capability
          - current_status
          - interpretive
          - normative
          - experiential
          - attributed
          - rhetorical
        source_status:
          enum:
          - verified_fact
          - supplied_source
          - attributed_view
          - author_judgement
          - personal_recollection
          - inference
          - contested
          - uncertain
          - unsupported
        confidence:
          type: number
          minimum: 0
          maximum: 1
        supporting_sources:
          type: array
          items:
            type: string
            minLength: 1
        verification_required:
          type: boolean
        publication_status:
          enum:
          - approved
          - qualify
          - attribute
          - verify
          - query
          - remove
          - unresolved
        final_locations:
          type: array
          items:
            type: string
            minLength: 1
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
