$schema: https://json-schema.org/draft/2020-12/schema
$id: https://editorial-integrity.local/schemas/anti_slop_audit.schema.yaml
title: Anti-Slop Audit
description: Contextual editorial audit without origin detection or automatic rewriting.
type: object
additionalProperties: false
required:
- schema_version
- artefact_type
- assignment_id
- artefact_version
- status
- input_versions
- unresolved_issues
- human_action_required
- context_baseline
- findings
- origin_claim_made
- rewrite_authorised
properties:
  schema_version:
    const: '1.0'
  artefact_type:
    const: anti_slop_audit
  assignment_id:
    type: string
    minLength: 1
  artefact_version:
    type: string
    pattern: ^\d+(?:\.\d+)*$
  status:
    enum:
    - complete
    - conditional
    - human_input_required
    - blocked
    description: Execution status of the specialist task. It is distinct from publication risk or release
      outcome.
  input_versions:
    type: object
    additionalProperties:
      type: string
      minLength: 1
    minProperties: 1
  unresolved_issues:
    type: array
    items:
      $ref: '#/$defs/unresolved_issue'
  human_action_required:
    type: boolean
  context_baseline:
    type: object
    additionalProperties: false
    required:
    - form
    - audience
    - purpose
    - voice_profile_used
    - protected_characteristics
    properties:
      form:
        type: string
        minLength: 1
      audience:
        type: string
        minLength: 1
      purpose:
        type: string
        minLength: 1
      voice_profile_used:
        type: boolean
      protected_characteristics:
        type: array
        items:
          type: string
          minLength: 1
  findings:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - finding_id
      - location
      - category
      - severity
      - confidence
      - observed_pattern
      - consequence
      - false_positive_test
      - protected_traits_considered
      - treatment
      properties:
        finding_id:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        category:
          enum:
          - linguistic_genericity
          - rhetorical_defaulting
          - structural_over_regularity
          - epistemic_failure
          - conversational_residue
          - formatting_residue
          - voice_erasure_risk
        severity:
          enum:
          - P0
          - P1
          - P2
          - P3
        confidence:
          type: number
          minimum: 0
          maximum: 1
        observed_pattern:
          type: string
          minLength: 1
        consequence:
          type: string
          minLength: 1
        false_positive_test:
          type: string
          minLength: 1
        protected_traits_considered:
          type: array
          items:
            type: string
            minLength: 1
        treatment:
          enum:
          - preserve
          - query
          - edit
          - block
  origin_claim_made:
    const: false
  rewrite_authorised:
    const: false
$defs:
  unresolved_issue:
    type: object
    additionalProperties: false
    required:
    - issue_id
    - description
    - owner
    - blocking
    - required_action
    properties:
      issue_id:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      owner:
        enum:
        - author
        - project_owner
        - router
        - specialist
        - verifier
        - approver
        - unknown
      blocking:
        type: boolean
      required_action:
        type: string
        minLength: 1
allOf:
- if:
    properties:
      status:
        const: complete
    required:
    - status
  then:
    properties:
      unresolved_issues:
        maxItems: 0
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: conditional
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
    required:
    - unresolved_issues
- if:
    properties:
      status:
        const: human_input_required
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
      human_action_required:
        const: true
    required:
    - unresolved_issues
    - human_action_required
- if:
    properties:
      status:
        const: blocked
    required:
    - status
  then:
    properties:
      unresolved_issues:
        minItems: 1
        contains:
          type: object
          properties:
            blocking:
              const: true
          required:
          - blocking
        minContains: 1
    required:
    - unresolved_issues
